       style="font-family:'Adwaita Mono';-inkscape-font-specification:'Adwaita Mono';writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect1);display:inline;fill:#000000;stroke-width:0.623622"
       transform="translate(-56,44.690113)"><tspan
         x="64"
         y="202.764"
         id="tspan2">welcome, dear traveller!
</tspan><tspan
         x="64"
         y="217.764"
         id="tspan3">
</tspan><tspan
         x="64"
         y="232.764"
         id="tspan4">i see you have gotten into the </tspan><tspan
         x="64"
         y="247.764"
         id="tspan5">weeds, and want to update/change </tspan><tspan
         x="64"
         y="262.764"
         id="tspan6">the font, don't you?
</tspan><tspan
         x="64"
         y="277.764"
         id="tspan7">
</tspan><tspan
         x="64"
         y="292.764"
         id="tspan8">well, you just have to care </tspan><tspan
         x="64"
         y="307.764"
         id="tspan9">about the following:
</tspan><tspan
         x="64"
         y="322.764"
         id="tspan10">- no groups, these wont encode
</tspan><tspan
         x="64"
         y="337.764"
         id="tspan11">- your fonts will be shrunken or </tspan><tspan
         x="64"
         y="352.764"
         id="tspan12">stretched out to fit into </tspan><tspan
         x="64"
         y="367.764"
         id="tspan13">squares
</tspan><tspan
         x="64"
         y="382.764"
         id="tspan14">- no colors, they also don't </tspan><tspan
         x="64"
         y="397.764"
         id="tspan15">encode
</tspan><tspan
         x="64"
         y="412.764"
         id="tspan16">- no multiple paths per glyph.
</tspan><tspan
         x="64"
         y="427.764"
         id="tspan17">- be sure to give each glyph the </tspan><tspan
         x="64"
         y="442.764"
         id="tspan18">right id.</tspan></text>
